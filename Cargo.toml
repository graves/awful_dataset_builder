[package]
name = "awful_dataset_builder"
version = "0.1.3"
edition = "2021"
license = "CC-BY-SA-4.0"
description = "Build LLM-ready Q/A datasets from reference text-to-question mappings produced by Awful Knowledge Synthesizer."
readme = "README.md"
repository = "https://github.com/graves/awful_dataset_builder"
homepage = "https://github.com/graves/awful_dataset_builder"
documentation = "https://docs.rs/awful_dataset_builder"
keywords = ["llm", "dataset", "cli", "yaml", "finetune"]
categories = ["command-line-utilities", "text-processing", "development-tools"]
rust-version = "1.76"

# Publish only what end users need
include = [
  "src/**",
  "README.md",
  "LICENSE*",
  "Cargo.toml",
]

# Keep large/demo assets out of the crate
exclude = [
  "inputs/**",
  "complete/**",
  "demo.gif",
  ".github/**",
  ".vscode/**",
  "target/**",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.45.0", features = ["full"] }
awful_aj = "0.3.6"
regex = "1.11.1"
